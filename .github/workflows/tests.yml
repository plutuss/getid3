name: Tests
on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            testbench: '^9.0'
            # Legacy framework is installed only in an isolated compatibility job.
            composer-flags: '--no-security-blocking'
          - php: '8.3'
            testbench: '^10.0'
          - php: '8.4'
            testbench: '^11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, mbstring, dom, xml, xmlwriter
          coverage: none
      - run: composer validate --strict
      - run: composer require --dev "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --prefer-dist --with-all-dependencies ${{ matrix.composer-flags }}
      - run: composer test
