name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  pull-request:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Open release pull request
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = context.ref.replace('refs/tags/', '');
            const branch = `release/${version}`;
            const { data: repo } = await github.rest.repos.get(context.repo);
            const { data: existing } = await github.rest.pulls.list({
              ...context.repo,
              head: `${context.repo.owner}:${branch}`,
              base: repo.default_branch,
              state: 'open',
            });
            if (existing.length) {
              core.info(existing[0].html_url);
              return;
            }
            const upgrade = fs.readFileSync('UPGRADING.md', 'utf8');
            const { data: pr } = await github.rest.pulls.create({
              ...context.repo,
              head: branch,
              base: repo.default_branch,
              title: `Release ${version}: reliable media analysis and regression tests`,
              body: `Fix repeated URL downloads, resource cleanup, cache invalidation, duration formatting and normalized ID3 metadata. Add artwork accessors without HTTP side effects, regression tests and usage documentation.\n\nThe release test matrix passed for Laravel 11, 12 and 13. Local validation: 16 tests and 54 assertions on PHP 8.4.12 with each framework version; Composer and syntax checks passed.\n\n${upgrade}\n\n[Changelog](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${version}/CHANGELOG.md)`,
            });
            core.info(pr.html_url);

  publish:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Publish release from changelog
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = context.ref.replace('refs/tags/', '');
            if (!/^\d+\.\d+\.\d+$/.test(version)) {
              throw new Error(`Unsupported release tag: ${version}`);
            }
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const heading = `## [${version}]`;
            const start = changelog.split('\n').findIndex(line => line.startsWith(`${heading} - `));
            if (start < 0) throw new Error(`Missing changelog section for ${version}`);
            const lines = changelog.split('\n').slice(start + 1);
            const end = lines.findIndex(line => line.startsWith('## ') || /^\[\d/.test(line));
            const notes = (end < 0 ? lines : lines.slice(0, end)).join('\n').trim();
            if (!notes) throw new Error('Release notes must not be empty');
            try {
              const existing = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: version,
              });
              core.info(`Release already exists: ${existing.data.html_url}`);
            } catch (error) {
              if (error.status !== 404) throw error;
              const result = await github.rest.repos.createRelease({
                ...context.repo,
                tag_name: version,
                target_commitish: context.sha,
                name: version,
                body: `${notes}\n\n[Upgrade guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${version}/UPGRADING.md)\n\n[Full changelog](https://github.com/${context.repo.owner}/${context.repo.repo}/compare/1.5.0...${version})`,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              });
              core.info(result.data.html_url);
            }
